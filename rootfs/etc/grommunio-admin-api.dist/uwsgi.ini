[uwsgi]
plugin = python3
master = true
protocol = uwsgi
socket = /run/grommunio-admin-api/uwsgi.sock
chmod-socket = 660
chown-socket = grommunio:www-data
chdir = /usr/share/grommunio-admin-api
module = main
callable = API
processes = 2
threads = 1
lazy-apps = true
enable-threads = false
die-on-term = true
vacuum = true
need-app = true
uid = grommunio
gid = grommunio
logto = /var/log/grommunio-admin-api.log
import = tools.file_logs
