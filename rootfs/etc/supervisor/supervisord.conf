[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisor/supervisord.pid
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info

[program:redis]
command=/usr/bin/redis-server --daemonize no --bind 127.0.0.1 --dir /var/lib/redis --pidfile /run/redis/redis-server.pid --maxmemory 128mb --maxmemory-policy volatile-lru
user=redis
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:rspamd]
command=/usr/bin/rspamd -f -u _rspamd -g _rspamd
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

