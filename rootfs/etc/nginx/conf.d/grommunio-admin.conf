server {
    listen 8081 default_server;
    listen [::]:8081 default_server;
    server_name _;

    client_max_body_size 64M;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/grommunio-admin-web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /config.json {
        alias /etc/grommunio-admin-common/config.json;
        default_type application/json;
    }

    # Traffic status monitor for Grommunio Admin API (loopback only)
    location ^~ /statusmonitor {
        include /usr/share/grommunio-admin-common/traffic-sm*.conf;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # grommunio-admin-api
    location /api {
        include uwsgi_params;
        uwsgi_pass unix:/run/grommunio-admin-api/uwsgi.sock;
        uwsgi_read_timeout 300;
        uwsgi_send_timeout 300;
        uwsgi_param HTTP_PROXY "";
    }
}
