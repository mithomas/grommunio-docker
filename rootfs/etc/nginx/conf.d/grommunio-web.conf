map $http_x_forwarded_proto $fastcgi_https {
    default on;
    http off;
    https on;
}

map $http_origin $fastcgi_origin {
    default $http_origin;
    "~^http://(.*)$" "https://$1";
}

map $http_referer $fastcgi_referer {
    default $http_referer;
    "~^http://(.*)$" "https://$1";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;

    root /usr/share/grommunio-web;
    index index.php index.html;

    client_max_body_size 128M;

    # Forwarded headers from host reverse proxy
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Traffic status monitor for Grommunio Admin API (loopback only)
    location ^~ /statusmonitor {
        include /usr/share/grommunio-admin-common/traffic-sm*.conf;
        allow 127.0.0.1;
        allow ::1;
        deny all;
    }

    # grommunio-sync (Exchange ActiveSync)
    location ^~ /Microsoft-Server-ActiveSync {
        alias /usr/share/grommunio-sync/index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /usr/share/grommunio-sync/index.php;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_read_timeout 3600;
        fastcgi_send_timeout 3600;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Autodiscover (routed to gromox-http)
    location ^~ /Autodiscover/Autodiscover.xml {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /Autodiscover/Autodiscover.json {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /autodiscover/autodiscover.xml {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /autodiscover/autodiscover.json {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # EWS / RPC endpoints (routed to gromox-http if requested)
    location ^~ /EWS {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /rpc/rpcproxy.dll {
        proxy_pass http://127.0.0.1:10080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # grommunio-web PHP handler
    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS $fastcgi_https;
        fastcgi_param HTTP_HOST $http_host;
        fastcgi_param HTTP_ORIGIN $fastcgi_origin if_not_empty;
        fastcgi_param HTTP_REFERER $fastcgi_referer if_not_empty;
        fastcgi_param PHP_VALUE "
            post_max_size=31M
            upload_max_filesize=30M
            max_execution_time=3660
            session.cookie_secure=on
            session.cookie_httponly=on
            session.cookie_samesite=Strict
            allow_url_include=Off
            session.sid_bits_per_character=6
            zlib.output_compression=Off
            session.save_path=/var/lib/grommunio-web/session
            zend.exception_ignore_args=On
            zend.exception_string_param_max_len=0
        ";
        fastcgi_read_timeout 300;
        fastcgi_buffers 256 16k;
        fastcgi_buffer_size 16k;
    }

    # Static assets caching
    location ~* \.(?:jpg|jpeg|gif|css|png|js|ico|html|xml|txt|svg|woff|woff2|ttf|eot|mjs|map)$ {
        expires max;
        add_header Cache-Control "public, must-revalidate, proxy-revalidate";
        try_files $uri =404;
    }

    # Root location
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Deny access to .ht* files
    location ~ /\.ht {
        deny all;
    }
}
