name: Sync README to Docker Hub

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - '.github/workflows/sync-dockerhub-readme.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-readme:
    name: Update Docker Hub Overview
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate README size against Docker Hub 25KB limit
        run: |
          BYTES=$(wc -c < README.md)
          echo "README.md size: ${BYTES} bytes (limit: 25000 bytes)"
          if [ "$BYTES" -gt 25000 ]; then
            echo "::warning::README.md (${BYTES} bytes) exceeds Docker Hub's 25,000-byte limit and will be truncated."
          fi

      - name: Update Docker Hub Description
        if: env.DOCKERHUB_TOKEN != '' && env.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY != '' && env.DOCKERHUB_REPOSITORY || format('{0}/grommunio-docker', env.DOCKERHUB_USERNAME) }}
          readme-filepath: ./README.md
          short-description: "Production-ready, single-container Grommunio groupware on Debian 13 (Trixie) with Exim & Rspamd."
          enable-url-completion: true

      - name: Notify when Docker Hub credentials not configured
        if: env.DOCKERHUB_TOKEN == '' || env.DOCKERHUB_USERNAME == ''
        run: |
          echo "::notice::Docker Hub README sync skipped: DOCKERHUB_USERNAME or DOCKERHUB_TOKEN secret is not configured."
